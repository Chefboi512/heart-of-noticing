<header class="site-header" id="top">
  <div class="wrap site-header__inner">
    <div class="site-header__brand">
      <a class="logo" href="/" aria-label="The Heart of Noticing, home">
        <span class="logo__the">the</span>
        <span class="logo__name">Heart of Noticing</span>
      </a>
      {{ raw.here }}
    </div>
    <div class="menu">
      <button class="menu__button" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-button>
        <span data-menu-label>Menu</span>
        <span class="menu__icon" aria-hidden="true"></span>
      </button>
      <nav class="menu__panel" id="site-menu" aria-label="Main" data-open="false">
        <ul class="menu__list">
{{ raw.menuLinks }}
        </ul>
      </nav>
    </div>
  </div>
</header>
