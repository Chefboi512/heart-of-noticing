<div class="signup__box wash wash--circle">
  <form class="signup__form" action="{{ site.formAction }}" method="POST" data-basin-form data-phone="{{ site.phone.display }}" novalidate>
    <input type="hidden" name="interest" value="The Circle (Newsletter)">
    <input type="hidden" name="message" value="Please add me to The Circle.">
    <div class="field-row">
      <div class="field">
        <label for="circle-name">First name <span class="field__optional">optional</span></label>
        <input id="circle-name" name="first_name" type="text" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="circle-email">Email</label>
        <input id="circle-email" name="email" type="email" autocomplete="email" inputmode="email" required data-error-missing="Please add your email to join." data-error-invalid="That email looks incomplete. Check for a missing @ or dot." aria-describedby="circle-email-error">
        <p class="field__error" id="circle-email-error" hidden></p>
      </div>
    </div>
    <p class="form-error" role="alert" data-form-error hidden></p>
    <button class="btn" type="submit"><span class="btn__label">Join The Circle</span></button>
    <p class="signup__note">Never automated. Leave anytime.</p>
  </form>
  <div class="form-success form-success--circle" data-form-success tabindex="-1" hidden>
    <span class="success-ripples" aria-hidden="true"><span></span><span></span><span></span><i></i></span>
    <p class="display form-success__title">You’re in The Circle<span data-success-name></span>.</p>
    <p class="prose">Watch your inbox for a note from Emily. Until then, notice one good thing around you today.</p>
  </div>
</div>
