<footer class="site-footer">
  <div class="wrap site-footer__top">
    <div class="site-footer__brand">
      <a class="logo" href="/" aria-label="The Heart of Noticing, home">
        <span class="logo__the">the</span>
        <span class="logo__name">Heart of Noticing</span>
      </a>
      <p>Somatic breathwork with Emily in {{ site.area }}.</p>
    </div>
    <nav class="footer-nav" aria-label="Footer">
      <p class="eyebrow">Explore</p>
{{ raw.footerLinks }}
    </nav>
    <div class="site-footer__contact">
      <p class="eyebrow">Reach out</p>
      <a href="tel:{{ site.phone.tel }}">{{ site.phone.display }}</a>
      <a href="/connect">Send a message</a>
    </div>
  </div>
  <div class="wrap site-footer__bottom">
    <span>© {{ site.year }} {{ site.name }}</span>
    <a href="#top">Back to top</a>
  </div>
</footer>
